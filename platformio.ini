[platformio]
default_envs = esp32-s3-devkitc-1

[common]
framework = arduino
platform = espressif32
lib_deps =
    OneWire@2.3.7
    DallasTemperature@^3.11.0
    heman/AsyncMqttClient-esphome@^2.1.0
    ArduinoJson@7.4.2
    LittleFS
    Adafruit NeoPixel
    adafruit/Adafruit SHT4x Library@^1.0.5
    Adafruit BusIO@^1.14.0
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit MAX31855 library@^1.4.2

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
board_build.filesystem = littlefs
lib_deps = ${common.lib_deps}
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
upload_protocol = esptool
monitor_speed = 115200
build_flags = -D CONFIG_ESP_DRIVER_TSENS_ENABLE=y
    -I "$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/tools/sdk/esp32s3/include"
extra_scripts = build_validate.py, ota_flags.py, post_upload.py

[env:esp32-s3-devkitc-1-ota]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
board_build.filesystem = littlefs
lib_deps = ${common.lib_deps}
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
upload_protocol = espota
; Set a default; override per-upload with: --upload-port <ip_or_hostname>
upload_port = esp32-sensor.local
monitor_speed = 115200
build_flags = -D CONFIG_ESP_DRIVER_TSENS_ENABLE=y
    -I "$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/tools/sdk/esp32s3/include"
extra_scripts = build_validate.py, ota_flags.py, post_upload.py
